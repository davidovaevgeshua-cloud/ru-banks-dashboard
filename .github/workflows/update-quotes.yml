name: Update MOEX quotes

on:
  schedule:
    # 5 запусков по будням вокруг основной сессии MOEX (10:00–18:40 МСК).
    # Время — UTC (МСК = UTC+3). Шаг между открытием и закрытием — 130 мин.
    # Минуты не круглые: запуски «ровно в :00» GitHub откладывает сильнее всего.
    - cron: "3 7 * * 1-5"     # 10:03 МСК — сразу после открытия
    - cron: "11 9 * * 1-5"    # 12:11 МСК
    - cron: "21 11 * * 1-5"   # 14:21 МСК
    - cron: "31 13 * * 1-5"   # 16:31 МСК
    - cron: "53 15 * * 1-5"   # 18:53 МСК — сразу после закрытия (аукцион закрытия до 18:50)
  push:
    branches: [main]
    paths:
      - "scripts/update_quotes.py"
      - "certs/**"
  workflow_dispatch:
    inputs:
      finalize:
        description: "Финальный прогон дня (--finalize)"
        required: false
        default: "false"

concurrency:
  group: update-quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine finalize flag
        id: flag
        run: |
          FINALIZE=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Финальный прогон — любой плановый запуск после закрытия основной сессии
            # (18:50 МСК = 15:50 UTC) или ночью: GitHub может запускать cron с опозданием.
            HM=$(date -u +%H%M)
            if [ "$HM" -ge 1550 ] || [ "$HM" -lt 400 ]; then
              FINALIZE="--finalize"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.finalize }}" = "true" ]; then
            FINALIZE="--finalize"
          fi
          echo "flag=$FINALIZE" >> "$GITHUB_OUTPUT"
          echo "Using flag: '$FINALIZE'"

      - name: Run update
        run: |
          python scripts/update_quotes.py ${{ steps.flag.outputs.flag }}

      - name: Commit & push
        run: |
          git config user.name  "moex-bot"
          git config user.email "moex-bot@users.noreply.github.com"
          git add data/payload.json data/status.json data/quotes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            MSG="chore(quotes): $(date -u +'%Y-%m-%d %H:%M UTC') ${{ steps.flag.outputs.flag }}"
            git commit -m "$MSG"
            git pull --rebase origin main
            git push
          fi
