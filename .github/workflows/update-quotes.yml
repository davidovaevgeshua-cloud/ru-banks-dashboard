name: Update MOEX quotes

on:
  schedule:
    # Все времена — UTC. МСК = UTC+3.
    - cron: "0 9 * * 1-5"    # 12:00 МСК
    - cron: "0 12 * * 1-5"   # 15:00 МСК
    - cron: "0 14 * * 1-5"   # 17:00 МСК
    - cron: "0 16 * * 1-5"   # 19:00 МСК
    - cron: "59 20 * * 1-5"  # 23:59 МСК (финал дня)
  workflow_dispatch:
    inputs:
      finalize:
        description: "Финальный прогон дня (--finalize)"
        required: false
        default: "false"

concurrency:
  group: update-quotes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine finalize flag
        id: flag
        run: |
          FINALIZE=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Финализируем на самом позднем cron дня — 20:59 UTC.
            HOUR_UTC=$(date -u +%H)
            MIN_UTC=$(date -u +%M)
            if [ "$HOUR_UTC" = "20" ]; then
              FINALIZE="--finalize"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.finalize }}" = "true" ]; then
            FINALIZE="--finalize"
          fi
          echo "flag=$FINALIZE" >> "$GITHUB_OUTPUT"
          echo "Using flag: '$FINALIZE'"

      - name: Run update
        run: |
          python scripts/update_quotes.py ${{ steps.flag.outputs.flag }}

      - name: Commit & push
        run: |
          git config user.name  "moex-bot"
          git config user.email "moex-bot@users.noreply.github.com"
          git add data/payload.json data/status.json data/quotes.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            MSG="chore(quotes): $(date -u +'%Y-%m-%d %H:%M UTC') ${{ steps.flag.outputs.flag }}"
            git commit -m "$MSG"
            git push
          fi
